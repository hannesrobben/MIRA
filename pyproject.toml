[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mira"
version = "0.1.0"
description = "MIRA - Microscopy Image Registration & Analysis: structure detection, segmentation, alignment and statistics of phase and height images of printed micro-structures"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

authors = [
    { name = "Hannes Robben" }
]

keywords = [
    "digital holography",
    "microscopy",
    "image processing",
    "phase retrieval",
    "segmentation",
    "visualization"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent"
]

# Core: everything `import mira` and the processing / analysis computations
# need. OpenCV >= 4.10.0.84 is the first build that works with NumPy 2.
# The Python / NumPy baseline itself is decision M9 (TODO.md).
dependencies = [
    "numpy",
    "scipy",
    "opencv-python>=4.10.0.84",
    "scikit-image",
    "scikit-learn",
]

[project.optional-dependencies]
# Plotting (mira.visualization and the plot_* methods of StructureProcessor).
viz = [
    "matplotlib",
]
# Tables over prints: analysis.ensemble, compute_icc_from_dataframe, and
# reading / writing CSV files with ImageData.
analysis = [
    "pandas",
]
dev = [
    "mira[viz,analysis]",
    "pytest",
    "black",
    "yapf",
    "numpydoc",
    # Reference implementation for the ICC check (MI-76).
    "pingouin",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://github.com/hannesrobben/MIRA"
Repository = "https://github.com/hannesrobben/MIRA"
Issues = "https://github.com/hannesrobben/MIRA/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"

[tool.coverage.run]
source = ["mira"]